  <body class = "set_cursor">
    <div id="vbox">
    </div>
    <!--button id="dbg">DEBUG</button-->
    <a id = "close" draggable="false"></a>
  </body>
  <script language="JavaScript">
    $(function(){
      $("#vbox").append('<video id="v" src="tlbbvideo://' + window.location.hash.substr(1) + '" controls="hide"></video>')
      $("#dbg").on('click',function(){
        hostShowDevTools();
      })
      $("#close").on('click',function(){
        hostKillClient();
      })
      $("#v").bind('ended',function(){
        hostKillClient()
      })
      $("#v").bind('error',function(){
        hostKillClient()
      })
    })
    hostOnGameMessage(function(e){
      var msg = JSON.parse(e);
      if( msg && msg.command == "play" ) {
        hostShowWindow(true)
        $(function(){
          $("#v").get(0).play();
        })
      }
      if( msg && msg.command == "kill" ) {
        hostKillClient()
      }
    })
    $(document).keyup(function(e){
      if( e.keyCode == 27 || e.keyCode == 96 ) {
        hostKillClient()
      }
    })
    if( hostSendGameMessage ) {
      setInterval(function(){
        v = document.getElementById("v")
        if( v ) {
          hostSendGameMessage(JSON.stringify({
            action : "keep-alive",
            videotime : v.currentTime
          }))
        }
      },300);
    }
  </script>
