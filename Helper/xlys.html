<p class="STYLE7">  <strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE5">影响修炼效果的因素</span><br>
	<br>
  影响修炼效果的因素不光有修炼等级，还有角色等级和心法等级。<br>
  <br>
  这里的心法等级是指前六本心法书中等级最低的一本心法书的等级。<br>
  <br>
  即修炼的效果由修炼等级，角色等级，心法等级共同影响。所以千万不能单一的追求，可能效果并不好。只有三者全面发展才是修炼之道。<br>
