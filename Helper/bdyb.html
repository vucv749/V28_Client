<p class="STYLE2"><span class="STYLE3"><img src="arrow.gif" width="19" height="18" align="absmiddle">绑定元宝的基本规则</span><br>
  <br>
绑定元宝是元宝的绑定形式，与游戏中原有的元宝等值，元宝可以兑换为绑定元宝，但绑定元宝不能兑换成元宝。<br>
绑定元宝无携带等级限制，但有可携带上限，总携带上限为相当于999999的绑定元宝。<br>
绑定元宝不能交易，不能储存在仓库和商会等地。<br>
您可以使用绑定元宝在元宝商店中的绑定元宝商店中购买绑定的道具。</p>
<p class="STYLE2"><span class="STYLE3"><img src="arrow.gif" width="19" height="18" align="absmiddle">绑定元宝的获得方式</span><br>
  <br>
每周可以通过完成达到标准的工资任务获得一定数量的绑定元宝。<br>
参与一些活动也可以获得一定的绑定元宝。</p>
<p class="STYLE2"><span class="STYLE3"><img src="arrow.gif" width="19" height="18" align="absmiddle">绑定元宝的用途</span> <br>
  <br>
使用绑定元宝可以在绑定元宝商店购买其中的道具。 </p>
