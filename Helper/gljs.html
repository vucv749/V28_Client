<p class="STYLE7">  <strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE5">功力介绍</span><br>
	<br>
      提升修炼等级需要消耗功力。每个人初始的功力值是100/100。<br>
      <br>
      当想提升修炼等级的秘籍的当前修炼境界为第1~3重的时候，每提升修炼等级1次需要消耗33点功力；当想提升修炼等级的秘籍的当前修炼境界为第4~6重的时候，每提升修炼等级1次需要消耗50点功力；当想提升修炼等级的秘籍的当前修炼境界为第7~12重的时候，每提升修炼等级1次需要消耗100点功力。<br>
      <br>
      功力在每天00：00的时候会重置为100/100，也可以通过使用功力丹（元宝商店有售）来恢复功力。<br>
      <br>
      功力在00：00恢复到100/100是自动的。<br>
