<p class="STYLE7">  <strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE5">修炼背景介绍</span><br>
	<br>
  四本武学宝典，一位少林高僧。在习武之人手中代代相传的武学圣典“五行宝典”以及其他3本武学宝典重现江湖。只有一心向善之人才有资格去求教高僧指点一二。也只有善人才能成功修炼。<br>
  <br>
  修炼之人，自身基础能力能得到大幅度的提升。长久修炼，有朝一日将成为绝世高手。但如果心存歹念，修炼深层功力必将走火入魔，不攻自破甚至葬送性命。<br>
  <br>
  扫地神僧允许一心向善之人查看并学习这些宝典中的内容，并指点他们尽快领悟其中的奥秘。<br>
