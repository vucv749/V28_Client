<p class="STYLE4"><span class="STYLE8">武魂升级</span></p>
<p><span class="STYLE4"><span class="STYLE9"><img src="arrow.gif" width="19" height="18" align="absmiddle">武魂怎样升级</span><br>
</span> 使用道具：灵魂碎片喂养装备在你身上的武魂，武魂能够获得灵魂碎片中的经验。当武魂获得的经验满足升级条件的时候，武魂就会升级。 </p>
<p><span class="STYLE4"><span class="STYLE9"><img src="arrow.gif" width="19" height="18" align="absmiddle">武魂基础属性</span><br>
</span> 当武魂的等级提升时，武魂的5项基础属性：力量、灵气、体力、定力、身法会有所增加。而根据武魂的攻击类型不同，这5项属性的增长有不同的侧重。武魂的5项基础属性，最终会以一定的比率转化到人物的身上。也就是说，武魂的等级越高，能够给人物带来的属性点越多。武魂的成长率决定武魂的基础属性点数转化到人物身上的百分比，成长率越高，转化比率越大。 </p>
