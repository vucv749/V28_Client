<p class="STYLE4"><span class="STYLE8">武魂属相</span></p>
<p><span class="STYLE4"><span class="STYLE9"><img src="arrow.gif" width="19" height="18" align="absmiddle">怎样获得属相</span><br>
</span>当武魂的合成等级到达5级的时候，武魂会自动获得一个属相。武魂的属相有风、地、水、火四种。 </p>
<p><span class="STYLE4"><span class="STYLE9"><img src="arrow.gif" width="19" height="18" align="absmiddle">属相相克关系</span><br>
</span>武魂的属相一共有风、地、水、火四种，他们之间的关系是风克地、地克水、水克火、火克风。相克的效果是在战斗时伤害会放大。有属相的武魂会克制没有属相的武魂，不携带武魂视为没有属相。</p>
<p><span class="STYLE4"><span class="STYLE9"><img src="arrow.gif" width="19" height="18" align="absmiddle">属相相克效果</span><br>
</span>属相相克的最终效果，在一定程度上受到武魂合成等级的影响。 假使A、B两个玩家分别装备有两个武魂，A玩家的武魂克制B玩家的武魂。如果A玩家的武魂合成等级高于B玩家的武魂合成等级，伤害放大效果更加明显；如果A玩家的武魂合成等级低于B玩家的武魂合成等级，伤害放大效果将有所减弱。 </p>
