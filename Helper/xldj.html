<p class="STYLE7">  <strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE5">修炼等级介绍</span><br>
	<br>
  每个属性都有对应的修炼等级，玩家需要花费经验和金钱才能提升修炼等级。<br>
  <br>
  修炼等级是有上限的。修炼一共分为12重，第1重可以修炼的等级上限是10级，第2~6重每提升一重使修炼等级上限提高10，第7~12重每提升一重使修炼等级上限提高15。<br>
  <br>
  修炼秘籍的修炼等级每提升一级，都会增加玩家对应的属性。修炼等级越高，属性增加的越多。<br>
