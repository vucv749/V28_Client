<p><span class="STYLE4"><span class="STYLE9"><img src="arrow.gif" width="19" height="18" align="absmiddle">健康游戏时间标准 </span></span></p>
<ol class="STYLE10">
  <li>定义未成年人累计在线游戏时间1.5小时以内的为“健康”游戏时间。</li>
  <li>当未成年人当日游戏时间累计达1.5小时，将被请离游戏，且当日24时前无法再次登入游戏。</li>
  <li>每日22时至次日8时，未成年人无法登录游戏，此期间内已登录的角色，将被请出游戏。</li>
