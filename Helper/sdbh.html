<p class="STYLE12">  <span class="STYLE8"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>玩家商店盘出保护功能</span></p>
<p class="STYLE12">盘出保护： <br>
玩家店铺可设置盘出限制，这样可以保护玩家的店铺在盘出限制期间不能被盘出。</p>
<p class="STYLE12">当玩家自己开店成功或购买到店铺时，商店默认处于盘出限制状态。当要盘出商店时，必须等待3天的解除限制时间。</p>
<p class="STYLE12">盘出限制解除后的7天内，玩家可不受该功能限制自由盘出商店。同时也可以在解除盘出限制的7天内，手动再次激活盘出限制。</p>
<p class="STYLE12">店主和合作伙伴都可以查看到商店盘出限制的当前状态，但只有店主才能手动激活盘出限制。处于盘出中的商店不能激活盘出限制，并且盘出限制不影响玩家商店的倒闭。</p>
