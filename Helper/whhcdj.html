<p class="STYLE4"><span class="STYLE8">武魂合成等级</span></p>
<p><span class="STYLE4"><span class="STYLE9"><img src="arrow.gif" width="19" height="18" align="absmiddle">武魂合成等级</span><br>
</span>武魂合成等级决定武魂能够开辟的扩展属性栏数。初生的武魂合成等级为1，会自带一条扩展属性栏，并且拥有一条扩展属性。以后武魂的合成等级每提升一级。武魂能够开辟的扩展属性栏数增加1条。武魂的合成等级最高可以到10级。武魂的合成等级还会对武魂的扩展属性效果产生影响。合成等级越高，扩展属性效果越明显。 </p>
<p><span class="STYLE4"><span class="STYLE9"><img src="arrow.gif" width="19" height="18" align="absmiddle">怎样提升武魂合成等级</span><br>
</span>到大理NPC无崖子（139，180）处，能够提升武魂的合成等级。提升的时候，需要使用另一个武魂作为合成材料，材料武魂的合成等级需要等于想要提升合成等级的武魂，并且其携带等级不能低于想要提升合成等级的武魂。 </p>
