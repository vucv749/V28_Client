<p class="STYLE7">  <strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE5">修炼境界介绍</span><br>
	<br>
  修炼的境界一共有12重，境界越高，修炼等级上限就越高。<br>
  <br>
  要提升某个修炼秘籍的修炼境界需要达到以下条件：该修炼秘籍的修炼等级已经达到上限；同一本修炼宝典中，有其他任意两本修炼秘籍的修炼境界与要该修炼秘籍的当前修炼境界相同或者更高。<br>
  <br>
  例如：要把力量的修炼境界从第2重提升至第3重，需要有其他两个属性的修炼境界也已经达到第2重。只有达到这些条件，才可以提升修炼境界。<br>
