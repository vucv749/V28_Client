	<span class="STYLE8"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>时装时尚秀</span><br>
	在游戏中可以使用虹耀石对时装进行染色，突出你对时尚的独特理解。<br>
	1.到洛阳（246，129）处，与伊天彩对话，选择时装染色，可以打开时装染色的窗口。<br>
	2.时装染色需要消耗1个虹耀石和5金。<br>
	3.点击确定后染色完成，并生成随机样式的染色时装。<br>
	4.查看时装的说明就可以知道该时装是否可以染色。<br>
	5.在洛阳（246，129）伊天彩处可以将染色后的时装还原。<br>

</p>
